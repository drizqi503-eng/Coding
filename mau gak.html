<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pertanyaan Serius No Settingan</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: #ffe4e1; /* Pink gemes */
            color: #333;
            text-align: center;
            padding: 50px 20px;
        }
        .kotak-cinta {
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 450px;
            width: 100%;
            border: 4px dashed #ff69b4;
        }
        h2 {
            color: #ff1493;
            margin-bottom: 30px;
        }
        .area-tombol {
            position: relative;
            height: 150px;
            margin-top: 30px;
        }
        /* Desain Tombol Umum */
        .btn {
            padding: 15px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            position: absolute;
            transition: all 0.15s ease-in-out;
        }
        /* Tombol MAU (Gampang diklik) */
        .btn-mau {
            background-color: #2ecc71;
            color: white;
            left: 20%;
            top: 20%;
            box-shadow: 0 5px #27ae60;
        }
        .btn-mau:active {
            transform: translateY(4px);
            box-shadow: 0 1px #27ae60;
        }
        /* Tombol ENGGAK (Si Tukang Kabur) */
        .btn-enggak {
            background-color: #e74c3c;
            color: white;
            left: 60%;
            top: 20%;
            box-shadow: 0 5px #c0392b;
        }
        /* TRIK CSS: Pas mau disentuh, tombol ENGGAK langsung ngibrit dan mengecil */
        .btn-enggak:hover {
            left: 80%;
            top: -40%;
            transform: scale(0.1);
            opacity: 0; /* Menghilang perlahan biar dramatis */
        }
    </style>
</head>
<body>

    <div class="kotak-cinta">
        <h1>Hi Kamu... 💕</h1>
        <h2>Kamu mau gak jadi pacar aku?</h2>
        <p>(Pikirkan baik-baik, pilihanmu menentukan masa depan kita)</p>
        
        <div class="area-tombol">
            <!-- Tombol yang pasrah -->
            <button class="btn btn-mau" onclick="alert('Ciyee! Makasih yaa, nanti malam aku jemput pakai helikopter sewaan! 🛸❤️')">MAU</button>
            
            <!-- Tombol yang gak bisa diklik -->
            <button class="btn btn-enggak">ENGGAK</button>
        </div>
    </div>

</body>
</html>
